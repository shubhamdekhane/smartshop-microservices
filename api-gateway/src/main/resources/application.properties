server.port=8080
spring.application.name=api-gateway

# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable discovery-based routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ==========================================
# Spring Cloud Gateway Routes Configuration
# ==========================================
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=orderCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/order

# ==========================================
# Resilience4j Circuit Breaker Configurations
# ==========================================
resilience4j.circuitbreaker.instances.orderCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# ==========================================
# Resilience4j Time Limiter Configurations
# ==========================================
resilience4j.timelimiter.instances.orderCircuitBreaker.timeout-duration=3s
