services:

  # ── Infrastructure ──────────────────────────────────────────────────────
  # MySQL runs first because user/product/order/payment services need it.
  # start_period gives MySQL 60 seconds to initialize before health checks begin.
  mysql:
    image: mysql:8.0
    container_name: smartshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smartshop
      MYSQL_PASSWORD: smartshop123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartshop-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Zookeeper is required by Kafka to manage brokers and topics.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smartshop-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - smartshop-net

  # Kafka is the message bus. Order service sends messages here.
  # Payment and Notification services read messages from here.
  # Container name is 'kafka' - this is the hostname other containers use.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartshop-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - smartshop-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Zipkin collects tracing data from all services so you can see
  # the full journey of a request across multiple services.
  zipkin:
    image: openzipkin/zipkin
    container_name: smartshop-zipkin
    ports:
      - "9411:9411"
    networks:
      - smartshop-net

  # ── Spring Boot Services ────────────────────────────────────────────────
  # Discovery service (Eureka) must start first.
  # All other services register themselves here on startup.
  discovery-service:
    build: ./discovery-service
    container_name: smartshop-discovery
    ports:
      - "8761:8761"
    networks:
      - smartshop-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # API Gateway is the single entry point for all requests.
  # It routes requests to the correct service using Eureka.
  api-gateway:
    build: ./api-gateway
    container_name: smartshop-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - smartshop-net

  # User service handles registration and JWT login.
  # Needs MySQL for storing users.
  # FIX: Your properties say smartShop_User (camelCase) but we override
  # with smartshop_user (lowercase) which matches what init-db.sql creates.
  user-service:
    build: ./user-service
    container_name: smartshop-user
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/smartshop_user
      - SPRING_DATASOURCE_USERNAME=smartshop
      - SPRING_DATASOURCE_PASSWORD=smartshop123
    networks:
      - smartshop-net

  # Product service handles product CRUD operations.
  # Needs MySQL for storing products.
  product-service:
    build: ./product-service
    container_name: smartshop-product
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/smartshop_product
      - SPRING_DATASOURCE_USERNAME=smartshop
      - SPRING_DATASOURCE_PASSWORD=smartshop123
    networks:
      - smartshop-net

  # Order service creates orders, calls Product service via Feign,
  # and sends order events to Kafka.
  # FIX: Your properties say kafka-broker:9092 but container name is kafka.
  # We override with SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  order-service:
    build: ./order-service
    container_name: smartshop-order
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/smartshop_order
      - SPRING_DATASOURCE_USERNAME=smartshop
      - SPRING_DATASOURCE_PASSWORD=smartshop123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - smartshop-net

  # Payment service listens to Kafka for order events and processes payments.
  # FIX: Was missing MySQL dependency and credentials in docker-compose.
  # FIX: kafka-broker:9092 overridden with kafka:9092
  payment-service:
    build: ./payment-service
    container_name: smartshop-payment
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/smartshop_payment
      - SPRING_DATASOURCE_USERNAME=smartshop
      - SPRING_DATASOURCE_PASSWORD=smartshop123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - smartshop-net

  # Notification service listens to Kafka and sends emails.
  # FIX: kafka-broker:9092 overridden with kafka:9092
  notification-service:
    build: ./notification-service
    container_name: smartshop-notification
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - smartshop-net

volumes:
  mysql-data:

networks:
  smartshop-net:
    driver: bridge